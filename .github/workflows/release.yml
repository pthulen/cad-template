name: Release

# Push a tag like v1.2.0 to publish. notes/CHANGELOG.md must contain a
# matching "## [1.2.0]" section; it becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenGL runtime for OCP
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/export.py

      # Release assets need unique names, so exports/small/base.stl
      # becomes release/small-base.stl.
      - name: Collect files
        run: |
          mkdir release
          for f in exports/*/*; do
            variant=$(basename "$(dirname "$f")")
            cp "$f" "release/${variant}-$(basename "$f")"
          done
          ls release

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Print the lines between "## [<version>]" and the next "## [" heading.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' notes/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::notes/CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
